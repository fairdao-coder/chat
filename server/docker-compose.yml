services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: chatdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: ChatServer/Dockerfile
    depends_on:
      admin-api:
        condition: service_healthy
    environment:
      - ASPNETCORE_URLS=http://+:8080
      - CONNECTIONSTRINGS__DEFAULT=Host=postgres;Port=5432;Database=chatdb;Username=postgres;Password=postgres
      # 調試前端（flutter run --web-port=5173）跨域白名單；生產環境請顯式配置 Cors:Origins
      - Cors__Origins=http://localhost:5173,http://127.0.0.1:5173
    ports:
      - "8080:8080"

  admin-api:
    build:
      context: .
      dockerfile: AdminServer/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - ASPNETCORE_URLS=http://+:8080
      - CONNECTIONSTRINGS__DEFAULT=Host=postgres;Port=5432;Database=chatdb;Username=postgres;Password=postgres
      - SeedAdmin__UserName=admin
      - SeedAdmin__Password=admin123
    ports:
      - "5299:8080"

volumes:
  pgdata:
