name: flutter_chat
description: Flutter chat client (rewrite of MauiChat) for the ChatServer SignalR backend.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  dio: ^5.5.0
  signalr_netcore: ^1.4.4
  shared_preferences: ^2.3.0
  file_picker: ^8.0.6
  cached_network_image: ^3.4.1
  url_launcher: ^6.3.1
  intl: ^0.20.3
  web: ^1.0.0
  record: ^7.1.1
  audioplayers: ^6.1.0
  flutter_webrtc: ^1.5.0
  app_links: ^7.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
