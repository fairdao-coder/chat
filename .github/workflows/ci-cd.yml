# CI/CD for the Chat solution.
#
# What this does:
#   * server  (push + PR):  restore + build the ASP.NET Core SignalR hub (.NET 10)
#   * client  (push + PR):  `flutter pub get` + `flutter analyze` (static gate)
#   * build-web + build-android (push to main only):
#        build BOTH Flutter web apps AND the Android release APKs.
#   * assemble-dist + deploy-static (push to main only):
#        merge those into one tree and publish it to the ServeStatic/Chat
#        repository, which serves it via GitHub Pages:
#          https://servestatic.github.io/Chat/           -> chat client
#          https://servestatic.github.io/Chat/admin/     -> admin client
#          https://servestatic.github.io/Chat/download/  -> Android APK downloads
#   * docker (push to main only):
#        build the ChatServer image and push it to GitHub Container Registry
#        (ghcr.io/<owner>/<repo>/chat-server). Override at runtime with:
#          -e ConnectionStrings__Default=...  -e Jwt__Key=...  -e Cors__Origins=...
#
# One-time setup for the web deploy:
#   1. Create a PAT with the "repo" scope that can write to ServeStatic/Chat
#      and add it here as the secret SERVESTATIC_DEPLOY_TOKEN.
#   2. Optional but recommended: set the repository variables PUBLIC_API_BASE
#      and PUBLIC_ADMIN_API_BASE to point the apps at a real API. Without them
#      the deployed pages default to http://localhost:5298 / :5299.
#   3. Push to main once. The job below creates the gh-pages branch in the
#      target repo automatically (force-push works on an empty repo too), so
#      there is no need to create the branch by hand.
#   4. In ServeStatic/Chat: Settings -> Pages -> Build and deployment
#        Source: "Deploy from a branch"
#        Branch: gh-pages  /  Folder: / (root)
#      This step must come AFTER step 3 -- the branch picker only lists
#      branches that already exist.
#
# Note on base-href: the site is published as a *project* page
# (https://servestatic.github.io/Chat/), and the path is case-sensitive, so the
# builds use `--base-href "/Chat/"` and `--base-href "/Chat/admin/"`. If you
# later serve from a custom domain or a user/org site, change them to
# `--base-href "/"` and `--base-href "/admin/"`.

name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege at the top level; the deploy job widens its own scope below.
permissions:
  contents: read

# Cancel superseded runs on the same ref (keeps PR queues short).
concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  # ---------------------------------------------------------------------------
  # Server: build the ASP.NET Core SignalR backend (.NET 10 / net10.0)
  # ---------------------------------------------------------------------------
  server:
    name: Build Server (.NET 10)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server/ChatServer
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
          cache: true
          cache-dependency-path: server/ChatServer/ChatServer.csproj

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

  # ---------------------------------------------------------------------------
  # Client: static analysis gate for the Flutter app
  # ---------------------------------------------------------------------------
  client:
    name: Analyze Client (Flutter)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client/flutter_chat
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          # Pinned to the version used in local dev for reproducible builds.
          # Switch to `channel: stable` if you prefer "latest stable".
          flutter-version: "3.47.2"
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

  # ---------------------------------------------------------------------------
  # Admin Server: build the ASP.NET Core 10 admin / back-office backend
  # ---------------------------------------------------------------------------
  server-admin:
    name: Build Admin Server (.NET 10)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server/AdminServer
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
          cache: true
          cache-dependency-path: server/AdminServer/AdminServer.csproj

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

  # ---------------------------------------------------------------------------
  # Admin Client: static analysis gate for the Flutter admin app
  # ---------------------------------------------------------------------------
  client-admin:
    name: Analyze Admin Client (Flutter)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client/flutter_admin
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

  # ---------------------------------------------------------------------------
  # Build both Flutter web apps into a static tree:
  #     /         -> chat client  (client/flutter_chat)
  #     /admin/   -> admin client (client/flutter_admin)
  # Runs after all four quality gates pass, in parallel with build-android.
  # assemble-dist later merges in the Android APKs and the download page.
  # ---------------------------------------------------------------------------
  # ---------------------------------------------------------------------------
  # Bump the client version on every deployable change.
  #
  # Runs only on push to main. When client source changes, increment
  # versionCode (+1) and the patch part of versionName (+1) in pubspec.yaml,
  # then commit + push back. The follow-up run (triggered by this push) builds
  # and publishes with the new version. A guard skips when the last commit is
  # already a bump, preventing an infinite loop.
  # ---------------------------------------------------------------------------
  bump-version:
    name: Bump client version
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump & commit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # Guard: if the latest commit is already a bump, do nothing.
          if git log -1 --pretty=%s | grep -q '^chore(release): bump'; then
            echo "Last commit is a version bump; skipping to avoid a loop."
            exit 0
          fi

          before="${{ github.event.before }}"
          if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ]; then
            before="HEAD~1"
          fi

          changed=0
          bump() {
            local dir="$1" file="$1/pubspec.yaml"
            [ -f "$file" ] || return 0
            local ver name code maj min patch new
            ver="$(sed -n 's/^version:[[:space:]]*//p' "$file" | head -1 | tr -d '\r')"
            name="${ver%+*}"; code="${ver##*+}"
            IFS='.' read -r maj min patch <<< "$name"
            patch=$((patch + 1)); code=$((code + 1))
            new="${maj}.${min}.${patch}+${code}"
            sed -i "s/^version:.*/version: $new/" "$file"
            git add "$file"
            echo "bumped $dir -> $new"
            changed=1
          }

          if git diff --name-only "$before" "${{ github.sha }}" | grep -qE '^client/flutter_chat/'; then
            bump client/flutter_chat
          fi
          if git diff --name-only "$before" "${{ github.sha }}" | grep -qE '^client/flutter_admin/'; then
            bump client/flutter_admin
          fi

          if [ "$changed" -eq 0 ]; then
            echo "No client changes; nothing to bump."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(release): bump client versions"
          git push origin "HEAD:${{ github.ref_name }}"

  build-web:
    name: Build Web
    needs: [server, client, server-admin, client-admin]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          cache: true

      # --dart-define is only passed when the matching repository variable is
      # set; otherwise each app falls back to its localhost default.
      - name: Build chat client
        working-directory: client/flutter_chat
        run: |
          set -euo pipefail
          flutter pub get
          args=(--release --base-href "/Chat/")
          if [ -n "${{ vars.PUBLIC_API_BASE }}" ]; then
            args+=(--dart-define=API_BASE="${{ vars.PUBLIC_API_BASE }}")
          fi
          flutter build web "${args[@]}"

      - name: Build admin client
        working-directory: client/flutter_admin
        run: |
          set -euo pipefail
          flutter pub get
          args=(--release --base-href "/Chat/admin/")
          if [ -n "${{ vars.PUBLIC_ADMIN_API_BASE }}" ]; then
            args+=(--dart-define=ADMIN_API_BASE="${{ vars.PUBLIC_ADMIN_API_BASE }}")
          fi
          flutter build web "${args[@]}"

      - name: Assemble dist
        run: |
          set -euo pipefail
          mkdir -p dist/admin
          cp -r client/flutter_chat/build/web/. dist/
          cp -r client/flutter_admin/build/web/. dist/admin/
          # GitHub Pages is plain static hosting with no SPA fallback:
          #   * flutter_chat uses go_router *path* URLs, so refreshing
          #     /Chat/settings would 404 -- hence the 404.html copy.
          #   * flutter_admin uses MaterialApp(home:) with no URL routing,
          #     so it never needs a deep-link fallback.
          cp dist/index.html dist/404.html
          # Disable Jekyll so files starting with "_" are not stripped.
          touch dist/.nojekyll

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: dist

  # ---------------------------------------------------------------------------
  # Build the Android release APKs and offer them for download from the site.
  #
  # Runs in parallel with build-web; assemble-dist merges both into one tree.
  #
  # Signing: android/app/build.gradle.kts still uses the Flutter template
  # default (release signed with the debug key), so no keystore secret is
  # required. See README section 5 for switching to a real signing config.
  # ---------------------------------------------------------------------------
  build-android:
    name: Build Android APK
    needs: [client]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client/flutter_chat
    env:
      # CI 環境下禁用 Gradle daemon、檔案系統監視與 build cache，
      # 避免偶發的 "Already watching path" 錯誤，並確保 compileSdk 等
      # 配置變更不會被緩存遮蔽。
      GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.vfs.watch=false -Dorg.gradle.caching=false"
    steps:
      - uses: actions/checkout@v4

      # 17 must match JavaVersion.VERSION_17 in android/app/build.gradle.kts.
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          cache: true

      # Needed before the first Gradle build; the runner image usually already
      # has them accepted, so a failure here must not break the build.
      - name: Accept Android licenses
        run: yes | flutter doctor --android-licenses >/dev/null 2>&1 || true

      - name: Pub get
        run: flutter pub get

      # 只构建「按 ABI 拆分」的 APK：每個架構單獨一個包，體積遠小於整包。
      # 注意：GitHub 單文件上限 100MB。若連 split 包都超過，需要改用 App Bundle
      # (aab) 經 Play Store / 第三方分發，而非直接放 Pages。
      - name: Build split-per-abi APKs
        run: |
          set -euo pipefail
          args=(--release --split-per-abi)
          if [ -n "${{ vars.PUBLIC_API_BASE }}" ]; then
            args+=(--dart-define=API_BASE="${{ vars.PUBLIC_API_BASE }}")
          fi
          flutter build apk "${args[@]}"

      - name: Collect APKs
        run: |
          set -euo pipefail
          src=build/app/outputs/flutter-apk
          out="$GITHUB_WORKSPACE/apk-out"
          mkdir -p "$out"
          # Stable, friendly names so the download links never change.
          # Skip any variant the build did not produce rather than failing;
          # the download page only lists files that actually exist.
          copy_if_exists() {
            if [ -f "$src/$1" ]; then
              cp "$src/$1" "$out/$2"
            else
              echo "skip (not produced): $1"
            fi
          }
          copy_if_exists app-arm64-v8a-release.apk   chat-arm64-v8a.apk
          copy_if_exists app-armeabi-v7a-release.apk chat-armeabi-v7a.apk
          copy_if_exists app-x86_64-release.apk      chat-x86_64.apk

          # Report sizes and fail loudly if any file exceeds GitHub's 100MB
          # per-file hard limit (the deploy push would be rejected otherwise).
          for f in "$out"/*.apk; do
            sz="$(stat -c%s "$f")"
            echo "$(basename "$f"): $(numfmt --to=iec --suffix=B "$sz")"
            if [ "$sz" -gt 104857600 ]; then
              echo "::error file=$f::$(basename "$f") exceeds 100MB and cannot be pushed to GitHub."
              exit 1
            fi
          done

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: apk-out
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # iOS build. Must run on macOS: Xcode is only available there, so this
  # cannot be produced on a Linux or Windows runner (nor on a dev's Windows
  # machine) -- Apple's toolchain restriction.
  #
  # OPTIONAL SIGNING (recommended for shipping to the client / App Store):
  #   Provide these repository secrets and the job will produce a fully signed
  #   IPA that can be installed on a device / uploaded to App Store Connect:
  #     IOS_DIST_CERT_BASE64            p12 distribution cert, base64-encoded
  #     IOS_DIST_CERT_PASSWORD          password for the p12 above
  #     IOS_PROVISIONING_PROFILE_BASE64 .mobileprovision, base64-encoded
  #     IOS_TEAM_ID                     Apple Team ID (10-char, e.g. AB12CD34EF)
  #   Encode locally with:
  #     base64 -w0 dist.p12 > cert.b64
  #     base64 -w0 app.mobileprovision > profile.b64
  #   If any of the three base64 secrets is missing, the job falls back to an
  #   UNSIGNED build (Runner.app in a zip). That cannot be installed on a real
  #   iPhone, but still serves as an iOS compile check and lets a Mac user sign
  #   it locally afterwards. The job never fails just because signing is off.
  #
  # Gated to main because macOS minutes are billed at 10x Linux on private repos.
  # ---------------------------------------------------------------------------
  build-ios:
    name: Build iOS
    needs: [client]
    if: github.ref == 'refs/heads/main'
    runs-on: macos-latest
    defaults:
      run:
        working-directory: client/flutter_chat
    env:
      KEYCHAIN_PATH: ${{ github.workspace }}/ios-signing.keychain-db
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          cache: true

      - name: Pub get
        run: flutter pub get

      # Podfile was missing from the repo; `flutter build ios` runs pod install
      # implicitly, but doing it explicitly surfaces CocoaPods errors sooner.
      - name: Install CocoaPods dependencies
        run: cd ios && pod install && cd ..

      # --- Optional signing setup -------------------------------------------
      # Only runs when the three base64 secrets are present. We create a
      # throwaway keychain, import the distribution cert, and install the
      # provisioning profile into ~/Library/MobileDevice/Provisioning Profiles.
      - name: Import signing certificate & profile
        if: >-
          ${{ secrets.IOS_DIST_CERT_BASE64 != '' &&
              secrets.IOS_DIST_CERT_PASSWORD != '' &&
              secrets.IOS_PROVISIONING_PROFILE_BASE64 != '' }}
        env:
          IOS_DIST_CERT_BASE64: ${{ secrets.IOS_DIST_CERT_BASE64 }}
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          KEY_PASSWORD="$(openssl rand -base64 24)"
          security create-keychain -p "$KEY_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEY_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db

          echo "$IOS_DIST_CERT_BASE64" | base64 --decode > /tmp/ios_dist.p12
          security import /tmp/ios_dist.p12 \
            -k "$KEYCHAIN_PATH" -P "$IOS_DIST_CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security -f pkcs12
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEY_PASSWORD" "$KEYCHAIN_PATH"
          rm -f /tmp/ios_dist.p12

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          echo "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$HOME/Library/MobileDevice/Provisioning Profiles/embedded.mobileprovision"

      # --- Build ------------------------------------------------------------
      # Signed path uses `flutter build ipa` (which runs an xcodebuild archive
      # + export). Unsigned path uses `flutter build ios --no-codesign`.
      - name: Build signed iOS IPA
        if: >-
          ${{ secrets.IOS_DIST_CERT_BASE64 != '' &&
              secrets.IOS_DIST_CERT_PASSWORD != '' &&
              secrets.IOS_PROVISIONING_PROFILE_BASE64 != '' }}
        env:
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          set -euo pipefail
          args=(--release)
          if [ -n "${{ vars.PUBLIC_API_BASE }}" ]; then
            args+=(--dart-define=API_BASE="${{ vars.PUBLIC_API_BASE }}")
          fi
          if [ -f "$HOME/Library/MobileDevice/Provisioning Profiles/embedded.mobileprovision" ]; then
            if [ -n "${IOS_TEAM_ID:-}" ]; then
              plutil -replace teamID -string "$IOS_TEAM_ID" ios/ExportOptions.plist
            fi
            args+=(--export-options-plist=ios/ExportOptions.plist)
          fi
          flutter build ipa "${args[@]}"

      - name: Build unsigned iOS app
        if: >-
          ${{ !(secrets.IOS_DIST_CERT_BASE64 != '' &&
                secrets.IOS_DIST_CERT_PASSWORD != '' &&
                secrets.IOS_PROVISIONING_PROFILE_BASE64 != '') }}
        run: |
          set -euo pipefail
          args=(--release --no-codesign)
          if [ -n "${{ vars.PUBLIC_API_BASE }}" ]; then
            args+=(--dart-define=API_BASE="${{ vars.PUBLIC_API_BASE }}")
          fi
          flutter build ios "${args[@]}"

      # --- Package -----------------------------------------------------------
      - name: Package signed IPA
        if: >-
          ${{ secrets.IOS_DIST_CERT_BASE64 != '' &&
              secrets.IOS_DIST_CERT_PASSWORD != '' &&
              secrets.IOS_PROVISIONING_PROFILE_BASE64 != '' }}
        run: |
          set -euo pipefail
          mkdir -p ios-out
          ipa="build/ios/ipa/Runner.ipa"
          if [ -f "$ipa" ]; then
            cp "$ipa" ios-out/Runner.ipa
          else
            echo "::error::Signed build did not produce Runner.ipa"
            exit 1
          fi
          ls -lh ios-out

      - name: Package unsigned app
        if: >-
          ${{ !(secrets.IOS_DIST_CERT_BASE64 != '' &&
                secrets.IOS_DIST_CERT_PASSWORD != '' &&
                secrets.IOS_PROVISIONING_PROFILE_BASE64 != '') }}
        run: |
          set -euo pipefail
          mkdir -p ios-out
          # ditto preserves the .app bundle structure (a plain zip would not).
          ditto -c -k --sequesterRsrc --keepParent \
            build/ios/iphoneos/Runner.app ios-out/Runner-unsigned.zip
          ls -lh ios-out

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-build
          # defaults.run.working-directory 不影響 uses 步驟，必須從倉庫根目錄指定完整相對路徑。
          path: client/flutter_chat/ios-out
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Merge the web build and the Android APKs into the final published tree:
  #     /          -> chat client
  #     /admin/    -> admin client
  #     /download/ -> APK download page
  # ---------------------------------------------------------------------------
  assemble-dist:
    name: Assemble dist
    needs: [build-web, build-android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download web build
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: dist

      - name: Download APKs
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: dist/download

      - name: Generate download page
        run: |
          set -euo pipefail
          # Strip CR in case the script was committed with CRLF endings;
          # bash would otherwise fail on the shebang line.
          sed -i 's/\r$//' .github/scripts/gen-download-page.sh
          version="$(sed -n 's/^version:[[:space:]]*//p' client/flutter_chat/pubspec.yaml | head -1 | tr -d '\r')"
          # The 4th arg is the deployed site base. Override with the
          # PUBLIC_WEB_BASE repo variable when serving from a custom domain.
          site_base="https://servestatic.github.io/Chat/"
          if [ -n "${{ vars.PUBLIC_WEB_BASE }}" ]; then
            site_base="${{ vars.PUBLIC_WEB_BASE }}"
          fi
          bash .github/scripts/gen-download-page.sh "$PWD/dist/download" "$version" "${GITHUB_SHA::7}" "$site_base"

      - name: Generate config link page
        run: |
          set -euo pipefail
          sed -i 's/\r$//' .github/scripts/gen-config-page.sh
          version="$(sed -n 's/^version:[[:space:]]*//p' client/flutter_chat/pubspec.yaml | head -1 | tr -d '\r')"
          bash .github/scripts/gen-config-page.sh "$PWD/dist/config" "$version" "${GITHUB_SHA::7}"

      - name: Copy config page SPA fallback
        if: always()
        run: |
          set -euo pipefail
          # 與聊天客戶端一致：刷新 /config/ 深鏈時需要 404 回退。
          cp dist/config/index.html dist/config/404.html 2>/dev/null || true

      - name: Upload final site
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist

  # ---------------------------------------------------------------------------
  # Publish the static tree to the ServeStatic/Chat repository.
  #
  # `actions/deploy-pages` can only publish to the repository the workflow
  # runs in, so instead we push the built files to the `gh-pages` branch of
  # the target repo and let GitHub Pages serve that branch.
  # ---------------------------------------------------------------------------
  deploy-static:
    name: Deploy to ServeStatic/Chat
    needs: [assemble-dist]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      TARGET_REPO: ServeStatic/Chat
      TARGET_BRANCH: gh-pages
    steps:
      - name: Download site
        uses: actions/download-artifact@v4
        with:
          name: site
          path: dist

      - name: Push to gh-pages
        env:
          TOKEN: ${{ secrets.SERVESTATIC_DEPLOY_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "${TOKEN:-}" ]; then
            echo "::error title=Missing secret::SERVESTATIC_DEPLOY_TOKEN is not set. Create a PAT with the 'repo' scope and add it under Settings -> Secrets and variables -> Actions."
            exit 1
          fi

          git config --global user.name  "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global init.defaultBranch main

          rm -rf publish
          mkdir publish
          cd publish
          git init
          git checkout -b "$TARGET_BRANCH"

          cp -r ../dist/. .
          git add -A

          # Nothing staged => content is identical to the last deploy.
          if [ -z "$(git status --porcelain)" ]; then
            echo "No content changes to publish."
            exit 0
          fi

          git commit -m "${TARGET_REPO}#${TARGET_BRANCH}"

          # Send the token as an Authorization header instead of embedding it
          # in the remote URL, so it never shows up in git error output.
          AUTH="$(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)"
          git -c "http.extraheader=AUTHORIZATION: basic ${AUTH}" \
              push --force "https://github.com/${TARGET_REPO}.git" "HEAD:${TARGET_BRANCH}"

          echo "Published to https://github.com/${TARGET_REPO}/tree/${TARGET_BRANCH}"

  # ---------------------------------------------------------------------------
  # Build & push the ChatServer image to GitHub Container Registry (push to main).
  # ---------------------------------------------------------------------------
  docker:
    name: Build & Push Image (GHCR)
    needs: [server]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # GHCR push requires the packages scope (overrides the top-level read only).
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/chat-server
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: server
          file: server/ChatServer/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # ---------------------------------------------------------------------------
  # Build & push the AdminServer image to GitHub Container Registry (push to main).
  # ---------------------------------------------------------------------------
  docker-admin:
    name: Build & Push Admin Image (GHCR)
    needs: [server-admin]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta-admin
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/chat-admin-server
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: server
          file: server/AdminServer/Dockerfile
          push: true
          tags: ${{ steps.meta-admin.outputs.tags }}
          labels: ${{ steps.meta-admin.outputs.labels }}
